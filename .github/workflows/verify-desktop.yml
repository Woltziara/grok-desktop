name: Verify desktop source
on:
  push:
    branches: [main, pro/complete-desktop-20260914]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: desktop-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact source (no Git credentials or user data)
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          git archive --format=tar HEAD | gzip -n > evidence/source.tar.gz
          sha256sum evidence/source.tar.gz > evidence/source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-source-${{ runner.os }}-${{ github.sha }}
          path: evidence/source*
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck, tests and renderer build
        run: |
          set -o pipefail
          npm run check 2>&1 | tee evidence/check.log
          npm run build 2>&1 | tee evidence/build.log
      - name: Install Linux desktop test dependencies
        if: runner.os == 'Linux'
        run: node node_modules/playwright-core/cli.js install-deps chromium
      - name: Exercise desktop behavior with isolated synthetic data
        run: |
          set -o pipefail
          npm run test:desktop 2>&1 | tee evidence/desktop.log
      # Real account login and two physical machines still require their own evidence.
      - name: Verify Linux packaging, never publish
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --dir --publish never
      - name: Verify macOS package, helpers and signature, never publish
        if: runner.os == 'macOS'
        run: |
          set -o pipefail
          npx electron-builder --dir --publish never 2>&1 | tee evidence/package-mac.log
      - name: Export dependency archive for offline reproducible verification
        if: always()
        run: |
          if [ -d node_modules ]; then
            tar -czf evidence/dependencies-${{ runner.os }}.tar.gz node_modules
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-verification-${{ runner.os }}-${{ github.sha }}
          path: |
            evidence/*.log
            evidence/dependencies-*.tar.gz
          retention-days: 7
