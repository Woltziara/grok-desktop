<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';"
    />
    <title>Grok Desktop</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: #faf7f2;
        color: #3b3733;
        font-family: "TsangerJinKai04 W04", "TsangerJinKai04 W03", "PingFang SC", sans-serif;
        user-select: none;
        -webkit-app-region: drag;
        cursor: default;
      }
      html[data-theme="light"] body {
        background: #faf7f2;
        color: #3b3733;
      }
      .inner { padding: 24px; text-align: center; }
      strong {
        display: block;
        margin-top: 14px;
        font-size: 18px;
        font-weight: 650;
      }
      span { color: #8a8075; font-size: 13px; }
      html[data-theme="light"] span { color: #8a8075; }
      .boot-mark {
        width: 48px;
        height: 48px;
        margin: 0 auto;
        display: block;
      }
      .boot-spin {
        width: 22px;
        height: 22px;
        margin: 16px auto 0;
        border: 2.5px solid rgba(14, 116, 144, 0.22);
        border-top-color: #0e7490;
        border-radius: 50%;
        animation: boot-spin 0.75s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      (function () {
        try {
          var t = new URLSearchParams(location.search).get("theme");
          document.documentElement.setAttribute(
            "data-theme",
            t === "dark" ? "dark" : "light",
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div class="inner" role="status" aria-live="polite">
      <svg
        class="boot-mark"
        width="48"
        height="48"
        viewBox="0 0 32 32"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <rect width="32" height="32" rx="7.5" fill="#0A0A0A" />
        <rect
          x="0.5"
          y="0.5"
          width="31"
          height="31"
          rx="7.25"
          stroke="#FFFFFF"
          stroke-opacity="0.14"
          stroke-width="1"
        />
        <circle
          cx="16"
          cy="16"
          r="10"
          stroke="#FFFFFF"
          stroke-opacity="0.22"
          stroke-width="1"
        />
        <path
          d="M16 6 A10 10 0 0 1 26 16"
          stroke="#FFFFFF"
          stroke-opacity="0.85"
          stroke-width="1.35"
          stroke-linecap="round"
        />
        <path
          d="M16 8.2 L17.35 13.65 L22.8 15 L17.35 16.35 L16 21.8 L14.65 16.35 L9.2 15 L14.65 13.65 Z"
          fill="#FFFFFF"
        />
        <circle cx="16" cy="15" r="1.55" fill="#0A0A0A" />
        <circle cx="16" cy="15" r="0.85" fill="#FFFFFF" />
        <circle cx="26" cy="16" r="1.15" fill="#FFFFFF" />
      </svg>
      <strong>Grok Desktop</strong>
      <div><span>Loading the app…</span></div>
      <div class="boot-spin" aria-hidden="true"></div>
    </div>
  </body>
</html>
